<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-labelledby="t d">
  <title id="t">jiahao 嘉豪 — dual-profile evidence-verdict harness</title>
  <desc id="d">Left: project wordmark and the failed-measurement stance. Right: two half-profiles split by an information boundary - generator (advisory) and verifier (blocking) - over a six-rung evidence ladder.</desc>
  <style>
    .ink{fill:#24292f}.mut{fill:#57606a}.box{fill:#f6f8fa;stroke:#8c959f;stroke-width:1.5}
    .seam{stroke:#24292f;stroke-width:2}.acc{fill:#cf222e}.accT{fill:#cf222e;font-weight:600}
    .rung{fill:#eaeef2;stroke:#8c959f}.lbl{font:600 15px system-ui,Segoe UI,sans-serif;fill:#24292f}
    .sml{font:400 12.5px system-ui,Segoe UI,sans-serif;fill:#57606a}
    .ttl{font:700 20px system-ui,Segoe UI,sans-serif;fill:#24292f}
    .mono{font:500 13px Consolas,monospace}
    @media (prefers-color-scheme: dark){
      .ink{fill:#e6edf3}.mut{fill:#8b949e}.box{fill:#161b22;stroke:#30363d}
      .seam{stroke:#e6edf3}.acc{fill:#f85149}.accT{fill:#f85149}
      .rung{fill:#21262d;stroke:#30363d}.lbl{fill:#e6edf3}.sml{fill:#8b949e}.ttl{fill:#e6edf3}
    }
  </style>
  <text x="60" y="108" class="ttl" font-size="46" font-weight="700">jiahao 嘉豪</text>
  <text x="62" y="142" class="sml" font-size="16">prompt-as-mental-model distribution · generator × verifier</text>
  <text x="62" y="172" class="accT" font-size="15">a claim is a hypothesis — evidence decides it</text>
  <!-- dual-profile split mark -->
  <g transform="translate(760,34)">
    <rect x="0" y="0" width="96" height="96" rx="20" class="box"/>
    <rect x="96" y="0" width="96" height="96" rx="20" class="box"/>
    <line x1="96" y1="0" x2="96" y2="96" class="seam"/>
    <circle cx="48" cy="42" r="20" class="mut" opacity="0.85"/>
    <rect x="30" y="66" width="36" height="14" rx="7" class="mut" opacity="0.55"/>
    <circle cx="144" cy="42" r="20" class="ink"/>
    <rect x="126" y="66" width="36" height="14" rx="7" class="ink" opacity="0.8"/>
    <text x="48" y="118" text-anchor="middle" class="sml">generator</text>
    <text x="144" y="118" text-anchor="middle" class="sml">verifier</text>
    <text x="96" y="140" text-anchor="middle" class="sml" font-size="10.5">information boundary</text>
  </g>
  <!-- six-rung ladder motif -->
  <g transform="translate(1010,44)">
    <rect x="0" y="118" width="20" height="14" rx="3" class="rung"/>
    <rect x="26" y="99" width="20" height="33" rx="3" class="rung"/>
    <rect x="52" y="80" width="20" height="52" rx="3" class="rung"/>
    <rect x="78" y="61" width="20" height="71" rx="3" class="rung"/>
    <rect x="104" y="42" width="20" height="90" rx="3" class="rung"/>
    <rect x="130" y="23" width="20" height="109" rx="3" class="rung"/>
  </g>
  <line x1="60" y1="212" x2="1140" y2="212" class="seam" opacity="0.25"/>
  <text x="60" y="238" class="sml" font-size="13.5">deterministic checks → ground truth → re-execution → assertion decomposition → independent critic → honest NOT VERIFIED</text>
</svg>