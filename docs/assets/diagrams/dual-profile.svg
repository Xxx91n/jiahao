<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" role="img" aria-labelledby="t d">
  <title id="t">Dual-profile install flow</title>
  <desc id="d">One flag file .jiahao-profile selects the generator profile (3 surface-signal rules, advisory) installed in the primary agent, or the verifier profile (7 iron laws plus the 6-rung ladder, blocking) installed in a separate audit agent. The Stop gate emits PASS, FAIL, ESCALATE or NOT VERIFIED.</desc>
  <style>
    .ink{fill:#24292f}.mut{fill:#57606a}.box{fill:#f6f8fa;stroke:#8c959f;stroke-width:1.5}
    .seam{stroke:#24292f;stroke-width:2}.acc{fill:#cf222e}.accT{fill:#cf222e;font-weight:600}
    .rung{fill:#eaeef2;stroke:#8c959f}.lbl{font:600 15px system-ui,Segoe UI,sans-serif;fill:#24292f}
    .sml{font:400 12.5px system-ui,Segoe UI,sans-serif;fill:#57606a}
    .ttl{font:700 20px system-ui,Segoe UI,sans-serif;fill:#24292f}
    .mono{font:500 13px Consolas,monospace;fill:#24292f}
    .arr{stroke:#57606a;stroke-width:2;fill:none;marker-end:url(#ah)}
    .pill{fill:#eaeef2;stroke:#8c959f}
    @media (prefers-color-scheme: dark){
      .ink{fill:#e6edf3}.mut{fill:#8b949e}.box{fill:#161b22;stroke:#30363d}
      .seam{stroke:#e6edf3}.acc{fill:#f85149}.accT{fill:#f85149}
      .rung{fill:#21262d;stroke:#30363d}.lbl{fill:#e6edf3}.sml{fill:#8b949e}.ttl{fill:#e6edf3}
      .mono{fill:#e6edf3}.arr{stroke:#8b949e}.pill{fill:#21262d;stroke:#30363d}
    }
  </style>
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#57606a"/></marker></defs>
  <rect x="40" y="120" width="200" height="64" rx="10" class="box"/>
  <text x="140" y="146" text-anchor="middle" class="lbl">.jiahao-profile</text>
  <text x="140" y="168" text-anchor="middle" class="sml">flag at install (default: verifier)</text>
  <path d="M240 132 C 300 132 300 76 350 76" class="arr"/>
  <path d="M240 172 C 300 172 300 244 350 244" class="arr"/>
  <rect x="356" y="36" width="330" height="88" rx="10" class="box"/>
  <text x="521" y="62" text-anchor="middle" class="lbl">generator profile — advisory</text>
  <text x="521" y="84" text-anchor="middle" class="sml">3 surface-signal rules · in the primary agent</text>
  <text x="521" y="106" text-anchor="middle" class="sml">no evidence → no claim · never blocks</text>
  <rect x="356" y="200" width="330" height="88" rx="10" class="box"/>
  <text x="521" y="226" text-anchor="middle" class="lbl">verifier profile — blocking</text>
  <text x="521" y="248" text-anchor="middle" class="sml">7 iron laws · 6-rung ladder · separate audit agent</text>
  <text x="521" y="270" text-anchor="middle" class="sml">judge is never the author</text>
  <path d="M686 80 C 740 80 740 130 780 130" class="arr"/>
  <path d="M686 244 C 740 244 740 180 780 180" class="arr"/>
  <rect x="786" y="118" width="180" height="76" rx="10" class="box"/>
  <text x="876" y="146" text-anchor="middle" class="lbl">hooks</text>
  <text x="876" y="166" text-anchor="middle" class="sml">SessionStart activate</text>
  <text x="876" y="184" text-anchor="middle" class="sml">Stop verdict gate</text>
  <path d="M966 156 L 1020 156" class="arr"/>
  <g>
    <rect x="1026" y="60" width="134" height="42" rx="8" class="rung"/><text x="1093" y="86" text-anchor="middle" class="lbl">PASS</text>
    <rect x="1026" y="112" width="134" height="42" rx="8" class="acc"/><text x="1093" y="138" text-anchor="middle" fill="#fff" font-weight="600" font-family="system-ui" font-size="15">FAIL</text>
    <rect x="1026" y="164" width="134" height="42" rx="8" class="rung"/><text x="1093" y="190" text-anchor="middle" class="lbl">ESCALATE</text>
    <rect x="1026" y="216" width="134" height="42" rx="8" class="rung"/><text x="1093" y="242" text-anchor="middle" class="lbl">NOT VERIFIED</text>
  </g>
  <text x="1026" y="286" class="sml" font-size="11.5">four verdict states</text>
</svg>