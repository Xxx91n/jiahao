<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-labelledby="t d">
  <title id="t">The six-rung verification ladder</title>
  <desc id="d">Climb from the cheapest mechanical check to the weakest independent critic; stop at the first rung that holds. If none holds, the honest verdict is NOT VERIFIED.</desc>
  <style>
    .ink{fill:#24292f}.mut{fill:#57606a}.box{fill:#f6f8fa;stroke:#8c959f;stroke-width:1.5}
    .seam{stroke:#24292f;stroke-width:2}.acc{fill:#cf222e}.accT{fill:#cf222e;font-weight:600}
    .rung{fill:#eaeef2;stroke:#8c959f}.lbl{font:600 15px system-ui,Segoe UI,sans-serif;fill:#24292f}
    .sml{font:400 12.5px system-ui,Segoe UI,sans-serif;fill:#57606a}
    .ttl{font:700 20px system-ui,Segoe UI,sans-serif;fill:#24292f}
    .mono{font:500 13px Consolas,monospace;fill:#24292f}
    .arr{stroke:#57606a;stroke-width:2;fill:none;marker-end:url(#ah)}
    .pill{fill:#eaeef2;stroke:#8c959f}
    @media (prefers-color-scheme: dark){
      .ink{fill:#e6edf3}.mut{fill:#8b949e}.box{fill:#161b22;stroke:#30363d}
      .seam{stroke:#e6edf3}.acc{fill:#f85149}.accT{fill:#f85149}
      .rung{fill:#21262d;stroke:#30363d}.lbl{fill:#e6edf3}.sml{fill:#8b949e}.ttl{fill:#e6edf3}
      .mono{fill:#e6edf3}.arr{stroke:#8b949e}.pill{fill:#21262d;stroke:#30363d}
    }
  </style>
  <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#57606a"/></marker></defs>
  <text x="40" y="26" class="sml" font-size="13">climb in order — stop at the first rung that holds</text>
  <g>
    <rect x="70" y="40" width="44" height="40" rx="8" class="rung"/>
    <text x="92" y="66" text-anchor="middle" class="lbl">1</text>
    <rect x="128" y="40" width="700" height="40" rx="8" class="box"/>
    <text x="146" y="58" class="lbl" font-size="14">deterministic machine check</text>
    <text x="146" y="74" class="sml" font-size="11.5">tests, compilers, hash, state diff</text>
    
  </g>
  <g>
    <rect x="70" y="92" width="44" height="40" rx="8" class="rung"/>
    <text x="92" y="118" text-anchor="middle" class="lbl">2</text>
    <rect x="128" y="92" width="700" height="40" rx="8" class="box"/>
    <text x="146" y="110" class="lbl" font-size="14">ground truth the generator never saw</text>
    <text x="146" y="126" class="sml" font-size="11.5">db state, oracle output, re-derivation</text>
    
  </g>
  <g>
    <rect x="70" y="144" width="44" height="40" rx="8" class="rung"/>
    <text x="92" y="170" text-anchor="middle" class="lbl">3</text>
    <rect x="128" y="144" width="700" height="40" rx="8" class="box"/>
    <text x="146" y="162" class="lbl" font-size="14">independent re-execution</text>
    <text x="146" y="178" class="sml" font-size="11.5">re-run, re-query, replay in fresh context</text>
    
  </g>
  <g>
    <rect x="70" y="196" width="44" height="40" rx="8" class="rung"/>
    <text x="92" y="222" text-anchor="middle" class="lbl">4</text>
    <rect x="128" y="196" width="700" height="40" rx="8" class="box"/>
    <text x="146" y="214" class="lbl" font-size="14">checklist decomposition</text>
    <text x="146" y="230" class="sml" font-size="11.5">binary verifiable assertions, item by item</text>
    
  </g>
  <g>
    <rect x="70" y="248" width="44" height="40" rx="8" class="rung"/>
    <text x="92" y="274" text-anchor="middle" class="lbl">5</text>
    <rect x="128" y="248" width="700" height="40" rx="8" class="box"/>
    <text x="146" y="266" class="lbl" font-size="14">independent LLM critic</text>
    <text x="146" y="282" class="sml" font-size="11.5">weakest rung — triage signal, never proof</text>
    <text x="850" y="272" class="accT" font-size="12">weakest</text>
  </g>
  <g>
    <rect x="70" y="300" width="44" height="40" rx="8" class="box"/>
    <text x="92" y="326" text-anchor="middle" class="lbl">6</text>
    <rect x="128" y="300" width="700" height="40" rx="8" class="box"/>
    <text x="146" y="318" class="lbl" font-size="14">cannot be verified? say so</text>
    <text x="146" y="334" class="sml" font-size="11.5">NOT VERIFIED is a complete verdict</text>
    
  </g>
  <path d="M880 60 L 930 330" stroke="#57606a" stroke-width="1.5" stroke-dasharray="5 5" fill="none"/>
  <text x="940" y="40" class="accT" font-size="12.5">rung-5 indecisive → ESCALATE</text>
  <text x="940" y="60" class="sml" font-size="12">→ human adjudication:</text>
  <text x="940" y="80" class="sml" font-size="12">jiahao resolve --verdict pass|fail</text>
</svg>