name: macro-b-regression

# #39 / A-044 / R5-08 / spec §R5-D8 / D-033② / D-034④a
# jiahao 持续回归接入 CI：Macro-B（已上架层，capability 1 of 5 · preview）对本仓的定时回归。
# 本接入动作 = 多写者触发器 (a)「Macro-B 进 CI 定时回归」的激活点（D-034④a，
# 衔接 6F .scratch/architecture-recovery/reports/33-gate-registry.json mw-regression-ci 事件）。
#
# 触发面：schedule（每周一 03:17 UTC 定时回归）+ workflow_dispatch（手动复跑）。
#   - 不接 push / pull_request：本 job 是定时审计回归而非 PR 门禁——
#     PR 门属本仓既有 ci.yml 自有面，两类面不混；
#   - 已上架层限定：只跑 Macro-B one-shot，preview 层（Macro-C 等）不混入（D-033「持续回归仅限已上架层」）；
#   - job 绿 = 管线跑通且工件齐备（报告+回执+事实库），不是审计裁定绿——
#     裁定 supported/unsupported/insufficient 三档如实落数（反复接受非跑通，D-033）。
#
# 链：checkout 本仓（被测对象，fetch-depth 0 全历史供 gitlog 采集器）
#   + checkout Xxx91n/6F（审计引擎仓；私仓需 MACRO_AUDIT_6F_TOKEN secret，公仓回落 github.token）
#   → engine npm install + gen + build
#   → node 39-macro-b-one-shot.mjs --repo jiahao（产物落 $GITHUB_WORKSPACE/macro-b-artifacts）
#   → 工件上传：39-macro-b-jiahao.{md,json} + facts.jsonl + measurements + 39-audit-facts.duckdb

on:
  schedule:
    - cron: '17 3 * * 1'   # 每周一 03:17 UTC —— 定时回归（D-034④a 触发面）
  workflow_dispatch: {}

jobs:
  macro-b:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: checkout audited repo (jiahao, full history)
        uses: actions/checkout@v4
        with:
          path: audited-repo
          fetch-depth: 0          # gitlog 采集器需全历史（同 ci.yml fetch-depth:0 先例）

      - name: checkout audit engine (Xxx91n/6F)
        uses: actions/checkout@v4
        with:
          repository: Xxx91n/6F
          path: engine-repo
          ref: main               # 首次实跑前钉到含 39-macro-b-one-shot.mjs 的合并 SHA（上游锁定纪律 D-037）
          token: ${{ secrets.MACRO_AUDIT_6F_TOKEN || github.token }}   # 6F 私仓时配 MACRO_AUDIT_6F_TOKEN（repo 读权限）；公仓回落 github.token
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: engine-repo/engine/package-lock.json

      - name: build engine
        working-directory: engine-repo/engine
        run: |
          npm install --ignore-scripts
          npm run gen
          npm run build

      - name: Macro-B one-shot regression
        run: |
          node engine-repo/.scratch/architecture-recovery/reports/39-macro-b-one-shot.mjs \
            --repo jiahao \
            --root "$GITHUB_WORKSPACE/audited-repo" \
            --out "$GITHUB_WORKSPACE/macro-b-artifacts"

      - name: verify report artifacts (receipt + sidecar present)
        run: |
          test -f macro-b-artifacts/39-macro-b-jiahao.json
          grep -q '"receipt"' macro-b-artifacts/39-macro-b-jiahao.json
          grep -q '"scale": "Macro-B"' macro-b-artifacts/39-macro-b-jiahao.json
          test -f macro-b-artifacts/39-macro-b-jiahao.md
          echo "macro-b regression artifacts verified (pipeline green; verdict recorded honestly in report)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macro-b-jiahao-${{ github.run_id }}
          path: |
            macro-b-artifacts/39-macro-b-jiahao.md
            macro-b-artifacts/39-macro-b-jiahao.json
            macro-b-artifacts/39-macro-b-jiahao-facts.jsonl
            macro-b-artifacts/39-macro-b-jiahao-measurements.json
            macro-b-artifacts/39-macro-b-measurements.json
            macro-b-artifacts/39-audit-facts.duckdb
          if-no-files-found: warn
