name: ci
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    # Tag refs are release attempts and go through the release-gate job below;
    # running this one there too would double the suite and the whitespace
    # step has no base commit to diff against on a new tag.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    env:
      JIAHAO_TEST_TIER: public
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whitespace on changed lines
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          ZERO="0000000000000000000000000000000000000000"
          BASE="${PR_BASE:-$PUSH_BEFORE}"
          if [ -z "$BASE" ] || [ "$BASE" = "$ZERO" ]; then
            echo "::error::event payload carries no base revision"
            exit 1
          fi
          # PR: merge-base range; push: exact endpoints, since a force push can leave before off the ancestry
          if [ -n "$PR_BASE" ]; then
            git diff --check "$BASE...HEAD"
          else
            # fetch-depth 0 covers branches and tags, not a commit a force push left behind, so ask the server for that SHA
            if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
              if ! git fetch --no-tags origin "$BASE"; then
                echo "::error::cannot fetch base revision $BASE (force-pushed commit may be garbage-collected)"
                exit 1
              fi
            fi
            git diff --check "$BASE" HEAD
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --ignore-scripts
      # The diff step above only sees changed lines; a file that was never
      # `git add`ed is invisible to it. This one reads every text file in the
      # tree, untracked included (#102).
      - run: npm run check:whitespace
      # The generator gates run before the suite: a stale or hand-edited
      # artifact must be caught before anything else. The suite no longer
      # regenerates the working tree (#76 closed #66), so this order is a belt,
      # not the only thing keeping the comparison honest.
      - run: npm run check:adapters
      - run: npm run check:drift
      # A relative link that points at something `files` does not pack renders
      # dead on npmjs while every local check stays green (#102).
      - run: npm run check:links
      - run: npm test

  # #63: a tag is a release attempt. One command decides whether it may be
  # called released - tests, generation, drift, pack contents + sha256, install
  # dry-run, no-egress, declarations - and any red step fails the release.
  release-gate:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      JIAHAO_TEST_TIER: public
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the gate compares HEAD with the commit the tag points at
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # The branch job skips tag refs, so the whitespace check it carries has to
      # exist here too. HEAD^1 rather than `git show --check`: on a merge commit
      # `git show` runs a combined diff and reports nothing, so a whitespace
      # error merged in would pass. A tag on a parentless commit has no range to
      # check - fail with that reason instead of diffing all of history.
      - name: Check whitespace on the tagged commit
        run: |
          if ! git rev-parse -q --verify 'HEAD^1^{commit}' >/dev/null; then
            echo "::error::tagged commit $GITHUB_SHA has no parent; there is no changed-line range to check"
            exit 1
          fi
          git diff --check HEAD^1 HEAD
      - run: npm ci --ignore-scripts
      - name: Release gate
        run: npm run release:gate -- --evidence release-artifacts/release-evidence.json --artifact-dir release-artifacts
      - name: Step summary
        if: always()
        run: |
          EVIDENCE=release-artifacts/release-evidence.json
          if [ ! -f "$EVIDENCE" ]; then
            echo '## Release gate: no evidence file (the gate did not reach the end)' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node -e '
            const fs = require("fs");
            const e = JSON.parse(fs.readFileSync("'"$EVIDENCE"'", "utf8"));
            const lines = ["## Release gate " + (e.status === "green" ? "GREEN" : (e.status === "partial" ? "PARTIAL (not a release verdict)" : "RED")), "", "| step | result | ms |", "| --- | --- | --- |"];
            for (const s of e.steps) lines.push("| " + s.name + " | " + (s.ok ? "pass" : "FAIL") + " | " + s.ms + " |");
            if (e.artifact) lines.push("", e.artifact.file + " - sha256 `" + e.artifact.sha256 + "`", "");
            if (e.trees) for (const [dir, hash] of Object.entries(e.trees)) lines.push("- tree `" + dir + "` " + hash);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-${{ github.ref_name }}
          path: release-artifacts/
          if-no-files-found: warn
