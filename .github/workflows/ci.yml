name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # checkout's default fetch-depth=1 leaves PR base SHAs unfetched, so
          # `git diff base...HEAD` in the threshold guard dies with
          # "fatal: bad object". Full history keeps the coupling check real.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # --ignore-scripts: keep prepare (hooksPath) off CI runners
      - run: npm install --ignore-scripts
      - run: npm test
      - run: node scripts/check-drift.js
      # ADR-0028 D2: golden regen-diff must be byte-clean
      - run: node scripts/build-adapters.js --check
      # ADR-0028 D4: host-contract registry guard (same-commit ADR/CONTEXT coupling on PRs)
      - if: github.event_name == 'pull_request'
        run: node scripts/check-host-contracts.js ${{ github.event.pull_request.base.sha }}
      - run: node scripts/check-host-contracts.js
      # ADR-0027: pre-registered bench gate (real re-run over pinned corpus)
      - if: github.event_name == 'pull_request'
        run: node scripts/check-bench-thresholds.js ${{ github.event.pull_request.base.sha }}
      - run: node scripts/check-bench-thresholds.js
      - run: node scripts/bench-gate.js --ci
      # ADR-0029 D4: zero-miss behavioral probe gate as its own CI step
      # (independent of bench:gate; artifacts never enter runtime evidence)
      - run: node scripts/check-probes.js --ci --artifacts-dir probe-artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-gate
          path: |
            bench-artifacts/gate-metrics.json
            bench-artifacts/gate-junit.xml
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-gate
          path: |
            probe-artifacts/gate-metrics.json
            probe-artifacts/gate-junit.xml
          if-no-files-found: ignore
