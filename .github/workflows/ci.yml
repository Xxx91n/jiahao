name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      JIAHAO_TEST_TIER: public
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whitespace on changed lines
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          ZERO="0000000000000000000000000000000000000000"
          BASE="${PR_BASE:-$PUSH_BEFORE}"
          if [ -z "$BASE" ] || [ "$BASE" = "$ZERO" ]; then
            echo "::error::event payload carries no base revision"
            exit 1
          fi
          # PR: merge-base range; push: exact endpoints, since a force push can leave before off the ancestry
          if [ -n "$PR_BASE" ]; then
            git diff --check "$BASE...HEAD"
          else
            git diff --check "$BASE" HEAD
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --ignore-scripts
      - run: npm test
      - run: npm run check:adapters
      - run: npm run check:drift
