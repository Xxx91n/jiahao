name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # checkout's default fetch-depth=1 leaves PR base SHAs unfetched, so
          # `git diff base...HEAD` in the coupling guards dies with
          # "fatal: bad object". Full history keeps the coupling check real.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # --ignore-scripts: keep prepare (hooksPath) off CI runners
      - run: npm install --ignore-scripts
      # ADR-0036: the private bench corpus is not in git; restore it from a
      # base64 tar.gz secret into $RUNNER_TEMP. Without the secret the
      # corpus-dependent gates fail closed (intended posture).
      - name: restore bench corpus
        env:
          JIAHAO_BENCH_CORPUS_B64: ${{ secrets.JIAHAO_BENCH_CORPUS_B64 }}
        # secrets cannot be used in step-level if:, so guard inside the shell.
        run: |
          if [ -z "$JIAHAO_BENCH_CORPUS_B64" ]; then
            echo "JIAHAO_BENCH_CORPUS_B64 not set; corpus gates will fail closed"
          else
            echo "$JIAHAO_BENCH_CORPUS_B64" | base64 -d | tar -xz -C "$RUNNER_TEMP"
          fi
      # ADR-0034 D2/D5: exactly one gate entrypoint. The gate inventory lives
      # in docs/gates.json; registry<->ci wiring is machine-asserted by
      # scripts/check-ci-wiring.js, which runs first as a meta-check (order 0-99).
      - run: npm run gate:all
        env:
          # PR base for the same-commit coupling guards (ADR-0027 D2);
          # empty on push events, which the guards treat as "no base".
          CI_BASE_REF: ${{ github.event.pull_request.base.sha }}
          # ADR-0036: corpus restored above; resolver also falls back to the
          # install dir and the repo-private default (dev machines).
          JIAHAO_CORPUS_DIR: ${{ runner.temp }}/bench-corpus
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-gate
          path: |
            bench-artifacts/gate-metrics.json
            bench-artifacts/gate-junit.xml
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-gate
          path: |
            probe-artifacts/gate-metrics.json
            probe-artifacts/gate-junit.xml
          if-no-files-found: ignore
