name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      JIAHAO_TEST_TIER: public
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whitespace on changed lines
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          ZERO="0000000000000000000000000000000000000000"
          BASE="${PR_BASE:-$PUSH_BEFORE}"
          if [ -z "$BASE" ] || [ "$BASE" = "$ZERO" ]; then
            echo "::error::event payload carries no base revision"
            exit 1
          fi
          # PR: merge-base range; push: exact endpoints, since a force push can leave before off the ancestry
          if [ -n "$PR_BASE" ]; then
            git diff --check "$BASE...HEAD"
          else
            # fetch-depth 0 covers branches and tags, not a commit a force push left behind, so ask the server for that SHA
            if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
              if ! git fetch --no-tags origin "$BASE"; then
                echo "::error::cannot fetch base revision $BASE (force-pushed commit may be garbage-collected)"
                exit 1
              fi
            fi
            git diff --check "$BASE" HEAD
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --ignore-scripts
      # The generator gates run before the suite: test/adapters.test.js and two
      # other suites execute scripts/build-adapters.js, which rewrites every
      # generated file in the working tree. Run after them, check:adapters would
      # compare freshly generated output against itself and report clean even if
      # a committed generated file had been hand-edited.
      - run: npm run check:adapters
      - run: npm run check:drift
      - run: npm test
