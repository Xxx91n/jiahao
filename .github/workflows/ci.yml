name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      JIAHAO_TEST_TIER: public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --ignore-scripts
      - run: node scripts/coinage-triage.js
        name: coinage gate (avoid tier blocks, ADR-0103 D-C/D-E.1)
      - run: npm test
